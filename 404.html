<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Page not found</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  html,body{margin:0;height:100%;}
  body{background:#07090C;color:#E6EDF3;font-family:"Space Grotesk",system-ui,sans-serif;display:flex;align-items:center;padding:0 24px;
    background-image:linear-gradient(rgba(120,170,200,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,200,.045) 1px,transparent 1px);background-size:56px 56px;}
  main{max-width:720px;margin:0 auto;width:100%;}
  .mono{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#4DF0A0;}
  h1{font-weight:500;text-transform:uppercase;font-size:clamp(3rem,12vw,8rem);line-height:.95;letter-spacing:-.03em;margin:16px 0;}
  p{color:#A8B3BF;font-size:1.1rem;line-height:1.6;max-width:46ch;}
  a{display:inline-block;margin-top:18px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:#04141A;background:#38D9F5;padding:15px 24px;}
  a:hover{background:#7BE8FF;}
</style>
</head>
<body>
<main>
  <div class="mono">$ error 404</div>
  <h1>Page not found</h1>
  <p>That page doesn't exist or has moved. Head back to the main site.</p>
  <a href="/">Back to home →</a>
</main>
</body>
</html>
